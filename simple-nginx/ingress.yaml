apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-nginx
spec:
  ingressClassName: nginx
  rules:
    - host: nginx.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: simple-nginx
                port:
                  number: 80
