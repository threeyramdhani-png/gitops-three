apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-httpd
spec:
  ingressClassName: nginx
  rules:
    - host: httpd.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: simple-httpd
                port:
                  number: 80
